[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-inspector-coursework"
version = "0.3.0"
description = "Risk-aware, explainable fabric patch classification coursework"
requires-python = ">=3.11"
dependencies = [
  "torch==2.9.1", "torchvision==0.24.1", "numpy==2.3.5", "scipy==1.17.0",
  "pandas==2.2.3", "scikit-learn==1.8.0", "scikit-image==0.25.2",
  "matplotlib==3.10.8", "pillow==12.3.0", "fastapi==0.115.12",
  "uvicorn==0.34.2", "python-multipart==0.0.20"
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.0", "nbformat==5.10.4"]
vlm = ["transformers==4.57.1"]
notebooks = ["nbclient==0.10.2", "ipykernel==6.30.1"]
report = ["reportlab==4.4.9", "pypdf==6.10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
